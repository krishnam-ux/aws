t-fit: cover;\" />\n                    </a>\n                  </td>\n\n                  <!-- Center: Brand Name & Subtext -->\n                  <td align=\"center\" valign=\"middle\" style=\"padding: 0 12px;\">\n                    <div style=\"font-size: 15px; font-weight: 800; color: #0F172A; letter-spacing: -0.2px; line-height: 1.25; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n                      AWS <span style=\"color: #FF9900;\">Student Builder Group</span>\n                    </div>\n                    <div style=\"font-size: 9px; font-weight: 700; color: #64748B; letter-spacing: 0.8px; text-transform: uppercase; margin-top: 3px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n                      CHANDIGARH UNIVERSITY – UTTAR PRADESH\n                    </div>\n                  </td>\n\n                  <!-- Right: AWS Student Builder Group Logo -->\n                  <td align=\"right\" valign=\"middle\" style=\"width: 120px;\">\n                    <a href=\"https://www.awssbgcuup.tech\" target=\"_blank\" style=\"text-decoration: none; display: inline-block;\">\n                      <img src=\"https://www.awssbgcuup.tech/aws-sbg-logo.png\" alt=\"AWS Student Builder Group\" width=\"114\" height=\"40\" style=\"display: block; width: 114px; height: 40px; max-width: 114px; border: 0; outline: none; object-fit: contain;\" />\n                    </a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- 2. MAIN TEMPLATE CONTENT (Campus Hero + White Body) -->\n          <tr>\n            <td bgcolor=\"#FFFFFF\" style=\"background-color: #FFFFFF; padding: 0;\">\n              <!-- HERO BANNER (Dark Gradient Campus Background) -->\n<table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\" background=\"https://www.awssbgcuup.tech/images/cu-campus-hero-dark.png\" bgcolor=\"#0B1B2B\" style=\"background: url('https://www.awssbgcuup.tech/images/cu-campus-hero-dark.png') no-repeat center center / cover; background-color: #0B1B2B; table-layout: fixed;\">\n  <!--[if gte mso 9]>\n  <v:rect xmlns:v=\"urn:schemas-microsoft-com:vml\" fill=\"true\" stroke=\"false\" style=\"width:600px;height:190px;\">\n    <v:fill type=\"frame\" src=\"https://www.awssbgcuup.tech/images/cu-campus-hero-dark.png\" color=\"#0B1B2B\" />\n    <v:textbox inset=\"0,0,0,0\">\n  <![endif]-->\n  <tr>\n    <td align=\"left\" valign=\"middle\" style=\"padding: 32px 24px;\">\n      <div style=\"display: inline-block; width: 42px; height: 42px; background-color: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 10px; text-align: center; line-height: 42px; font-size: 20px; margin-bottom: 12px;\">\n              📊\n            </div>\n      <h1 class=\"hero-title-mobile\" style=\"margin: 0 0 6px 0; font-size: 24px; font-weight: 800; color: #FFFFFF; line-height: 1.25; letter-spacing: -0.3px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n        Official Exam Scorecard\n      </h1>\n      <div style=\"margin: 0; font-size: 13px; font-weight: 500; color: #E2E8F0; line-height: 1.4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n              Performance result for AWS Certified Solutions Architect Challenge.\n            </div>\n    </td>\n  </tr>\n  <!--[if gte mso 9]>\n    </v:textbox>\n  </v:rect>\n  <![endif]-->\n</table>\n<table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\" bgcolor=\"#FFFFFF\" style=\"background-color: #FFFFFF; padding: 24px;\">\n  <tr>\n    <td>\n      <div style=\"font-size: 15px; font-weight: 700; color: #0F172A; margin-bottom: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n        Dear Krishnam Dwivedi,\n      </div>\n      <p style=\"font-size: 14px; line-height: 1.6; color: #334155; margin: 0 0 16px 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n        Your evaluation for <strong>AWS Certified Solutions Architect Challenge</strong> is complete. Here is your official assessment scorecard:\n      </p>\n\n      <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\" bgcolor=\"#F8FAFC\" style=\"background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 14px 18px; margin: 18px 0;\">\n    <tr>\n        <td width=\"36\" valign=\"middle\" style=\"width: 36px; padding: 8px 0;\">\n          <div style=\"width: 32px; height: 32px; background-color: #FFF7ED; border: 1px solid #FED7AA; border-radius: 50%; text-align: center; line-height: 32px; font-size: 14px;\">\n            📝\n          </div>\n        </td>\n        <td valign=\"middle\" style=\"padding: 8px 0 8px 12px;\">\n          <div style=\"font-size: 10px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n            Assessment\n          </div>\n          <div style=\"font-size: 14px; font-weight: 700; color: #0F172A; margin-top: 1px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n            AWS Certified Solutions Architect Challenge\n          </div>\n        </td>\n      </tr><tr>\n        <td width=\"36\" valign=\"middle\" style=\"width: 36px; padding: 8px 0;\">\n          <div style=\"width: 32px; height: 32px; background-color: #FFF7ED; border: 1px solid #FED7AA; border-radius: 50%; text-align: center; line-height: 32px; font-size: 14px;\">\n            🎯\n          </div>\n        </td>\n        <td valign=\"middle\" style=\"padding: 8px 0 8px 12px;\">\n          <div style=\"font-size: 10px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n            Score Earned\n          </div>\n          <div style=\"font-size: 14px; font-weight: 700; color: #0F172A; margin-top: 1px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n            92 / 100\n          </div>\n        </td>\n      </tr><tr>\n        <td width=\"36\" valign=\"middle\" style=\"width: 36px; padding: 8px 0;\">\n          <div style=\"width: 32px; height: 32px; background-color: #FFF7ED; border: 1px solid #FED7AA; border-radius: 50%; text-align: center; line-height: 32px; font-size: 14px;\">\n            📈\n          </div>\n        </td>\n        <td valign=\"middle\" style=\"padding: 8px 0 8px 12px;\">\n          <div style=\"font-size: 10px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n            Percentage\n          </div>\n          <div style=\"font-size: 14px; font-weight: 700; color: #0F172A; margin-top: 1px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n            92%\n          </div>\n        </td>\n      </tr><tr>\n        <td width=\"36\" valign=\"middle\" style=\"width: 36px; padding: 8px 0;\">\n          <div style=\"width: 32px; height: 32px; background-color: #FFF7ED; border: 1px solid #FED7AA; border-radius: 50%; text-align: center; line-height: 32px; font-size: 14px;\">\n            ⚖️\n          </div>\n        </td>\n        <td valign=\"middle\" style=\"padding: 8px 0 8px 12px;\">\n          <div style=\"font-size: 10px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n            Final Verdict\n          </div>\n          <div style=\"font-size: 14px; font-weight: 700; color: #0F172A; margin-top: 1px; font-family: SFMono-Regular, Consolas, monospace; color: #EA580C;\">\n            PASSED\n          </div>\n        </td>\n      </tr>\n  </table>\n\n      <p style=\"font-size: 13px; color: #0F172A; font-weight: 700; margin: 16px 0 0 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n        AWS SBG CU-UP Examination Board\n      </p>\n    </td>\n  </tr>\n</table>\n            </td>\n          </tr>\n\n          <!-- Optional CTA Button injected if ctaText & ctaUrl are provided outside template content -->\n          \n\n          <!-- Optional Footer Notes -->\n          \n\n          <!-- 3. BRANDED CLEAN FOOTER -->\n          <tr>\n            <td bgcolor=\"#FFFFFF\" style=\"background-color: #FFFFFF; padding: 28px 24px 24px 24px; border-top: 1px solid #F1F5F9;\">\n              <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n                <!-- Social Channels + Website -->\n                <tr>\n                  <td align=\"center\" style=\"padding-bottom: 16px;\">\n                    <table border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n                      <tr>\n                        <!-- LinkedIn -->\n                        <td style=\"padding: 0 4px;\">\n                          <a href=\"https://www.linkedin.com/company/aws-sbg-cu/\" target=\"_blank\" style=\"text-decoration: none; display: inline-block;\">\n                            <div style=\"width: 26px; height: 26px; line-height: 26px; border-radius: 50%; background-color: #0A66C2; color: #FFFFFF; text-align: center; font-size: 11px; font-weight: bold; font-family: -apple-system, BlinkMacSystemFont, sans-serif;\">in</div>\n                          </a>\n                        </td>\n                        <!-- Instagram -->\n                        <td style=\"padding: 0 4px;\">\n                          <a href=\"https://www.instagram.com/awssbgcu/\" target=\"_blank\" style=\"text-decoration: none; display: inline-block;\">\n                            <div style=\"width: 26px; height: 26px; line-height: 26px; border-radius: 50%; background-color: #E1306C; color: #FFFFFF; text-align: center; font-size: 11px; font-weight: bold; font-family: -apple-system, BlinkMacSystemFont, sans-serif;\">ig</div>\n                          </a>\n                        </td>\n                        <!-- YouTube -->\n                        <td style=\"padding: 0 4px;\">\n                          <a href=\"https://www.youtube.com/@awssbgcu\" target=\"_blank\" style=\"text-decoration: none; display: inline-block;\">\n                            <div style=\"width: 26px; height: 26px; line-height: 26px; border-radius: 50%; background-color: #FF0000; color: #FFFFFF; text-align: center; font-size: 10px; font-weight: bold; font-family: -apple-system, BlinkMacSystemFont, sans-serif;\">yt</div>\n                          </a>\n                        </td>\n                        <!-- X (Twitter) -->\n                        <td style=\"padding: 0 4px;\">\n                          <a href=\"https://x.com/awssbgcu\" target=\"_blank\" style=\"text-decoration: none; display: inline-block;\">\n                            <div style=\"width: 26px; height: 26px; line-height: 26px; border-radius: 50%; background-color: #000000; color: #FFFFFF; text-align: center; font-size: 11px; font-weight: bold; font-family: -apple-system, BlinkMacSystemFont, sans-serif;\">𝕏</div>\n                          </a>\n                        </td>\n                        <!-- Website Link -->\n                        <td style=\"padding-left: 10px;\">\n                          <a href=\"https://www.awssbgcuup.tech\" target=\"_blank\" style=\"color: #0F172A; text-decoration: none; font-size: 12px; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">\n                            www.awssbgcuup.tech\n                          </a>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                </tr>\n\n                <!-- MANDATORY \"DO NOT     const listEl = document.getElementById('templateList');
    const titleEl = document.getElementById('previewTitle');
    const subjectEl = document.getElementById('previewSubject');
    const frameEl = document.getElementById('previewFrame');

    // Group by category
    const categories = ['COMMUNITY', 'EVENTS', 'OPPORTUNITIES', 'EXAMS', 'IDENTITY', 'TEAM', 'ADMIN'];
    
    categories.forEach(cat => {
      const items = templates.filter(t => t.category === cat);
      if (items.length === 0) return;

      const catHeader = document.createElement('div');
      catHeader.className = 'tpl-category-title';
      catHeader.textContent = cat;
      listEl.appendChild(catHeader);

      items.forEach(tpl => {
        const btn = document.createElement('button');
        btn.className = 'tpl-btn';
        btn.textContent = tpl.name;
        btn.onclick = () => selectTemplate(tpl.id, btn);
        btn.id = 'btn-' + tpl.id;
        listEl.appendChild(btn);
      });
    });

    function selectTemplate(id, btnEl) {
      document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');

      const tpl = templates.find(t => t.id === id);
      if (!tpl) return;

      titleEl.textContent = tpl.name;
      subjectEl.textContent = '— Subject: ' + tpl.subject;
      
      const doc = frameEl.contentDocument || frameEl.contentWindow.document;
      doc.open();
      doc.write(tpl.html);
      doc.close();
    }

    function setViewport(w, btn) {
      frameEl.style.width = w;
      document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // Select first template by default
    if (templates.length > 0) {
      const firstBtn = document.getElementById('btn-' + templates[0].id);
      selectTemplate(templates[0].id, firstBtn);
    }
  </script>
